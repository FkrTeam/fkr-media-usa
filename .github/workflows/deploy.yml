# Deploys the site to Cloudflare Workers on every push to main.
#
# The Cloudflare project is NOT connected to this repository through
# Workers Builds, so a push on its own deploys nothing. This workflow is
# what makes main the source of truth: build here, upload with wrangler.
#
# It needs two repository secrets (Settings → Secrets and variables →
# Actions):
#
#   CLOUDFLARE_API_TOKEN   an API token with the "Edit Cloudflare Workers"
#                          template permissions
#   CLOUDFLARE_ACCOUNT_ID  the account id shown on the Workers & Pages
#                          overview page
#
# VITE_BASE is forced to / because the committed .env targets the Apache
# sub-directory deploy at /fkr-media-usa/ — see wrangler.jsonc.

name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  # Manual re-deploy from the Actions tab, e.g. after rotating the token.
  workflow_dispatch:

# One deploy at a time; a newer push cancels an older one still in flight.
concurrency:
  group: cloudflare-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out
        uses: actions/checkout@v4

      # Fails fast with a readable message when a secret is missing or has
      # the wrong shape, instead of an opaque "Invalid format for
      # Authorization header" from the Cloudflare API. Only lengths and
      # character classes are printed — never the values.
      - name: Check Cloudflare secrets
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          fail=0
          describe() {
            local v="$1"
            local n=${#v}
            local cls="other"
            if [[ "$v" =~ ^[A-Za-z0-9_-]+$ ]]; then cls="token-chars"; fi
            if [[ "$v" =~ ^[0-9a-f]+$ ]]; then cls="hex"; fi
            if [[ "$v" =~ [[:space:]] ]]; then cls="contains-whitespace"; fi
            echo "length=$n chars=$cls"
          }
          echo "CLOUDFLARE_API_TOKEN: $(describe "$TOKEN")"
          echo "CLOUDFLARE_ACCOUNT_ID: $(describe "$ACCOUNT")"

          if [[ -z "$TOKEN" ]]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set"; fail=1
          elif [[ "$TOKEN" =~ [[:space:]] ]]; then
            echo "::error::CLOUDFLARE_API_TOKEN contains whitespace or a line break — re-paste it as a single line"; fail=1
          elif [[ "$TOKEN" =~ ^[0-9a-f]{37}$ ]]; then
            echo "::error::CLOUDFLARE_API_TOKEN looks like the Global API Key (37 hex chars). Create an API *token* instead: My Profile → API Tokens → Create Token → 'Edit Cloudflare Workers'"; fail=1
          elif [[ "$TOKEN" =~ ^[0-9a-f]{32}$ ]]; then
            echo "::error::CLOUDFLARE_API_TOKEN looks like an ID (32 hex chars), not a token. Paste the token *value* shown once at creation, or use 'Roll' to get a new value"; fail=1
          elif [[ ! "$TOKEN" =~ ^[A-Za-z0-9_-]{30,80}$ ]]; then
            echo "::error::CLOUDFLARE_API_TOKEN has an unexpected format — expected ~40 chars of letters, digits, _ and -; no quotes, no 'Bearer'"; fail=1
          fi

          if [[ -z "$ACCOUNT" ]]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID is not set"; fail=1
          elif [[ ! "$ACCOUNT" =~ ^[0-9a-f]{32}$ ]]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID should be 32 hex chars — Workers & Pages overview, right-hand column"; fail=1
          fi

          exit $fail

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_BASE: /

      - name: Deploy with wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # The action defaults to wrangler 3, which rejects an assets-only
          # config ("Missing entry-point"). Assets without a Worker need 4.
          wranglerVersion: "4.128.0"
          command: deploy
